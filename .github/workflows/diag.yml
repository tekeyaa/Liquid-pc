name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: блокировщик с исключением
        run: |
          exec > >(tee -a out.txt) 2>&1
          npm init -y >/dev/null && npm i @ghostery/adblocker-electron@^2.5.0 >/dev/null 2>&1; npm ls @ghostery/adblocker-electron | tail -1
          mkdir -p node_modules/electron && echo "module.exports = { ipcMain: { handle(){}, on(){} }, session: {} };" > node_modules/electron/index.js
          cat > t.js <<'JS'
          const { AdBlock } = require('./main/adblock');
          const lib = require('@ghostery/adblocker-electron');
          console.log('CosmeticFilter в electron-пакете:', typeof lib.CosmeticFilter);
          const ctx = { url: 'https://www.youtube.com/shorts/abc', hostname: 'www.youtube.com', domain: 'youtube.com', classes: ['ytd-shorts', 'ytd-reel-video-renderer'], ids: ['shorts-inner-container'], hrefs: [], getBaseRules: true, getInjectionRules: true, getExtendedRules: true, getRulesFromHostname: true, getRulesFromDOM: true };
          const has = (b) => (b.getCosmeticsFilters(ctx).styles || '').includes('shorts-inner-container > .ytd-shorts:has');
          (async () => {
            const dir = require('fs').mkdtempSync('/tmp/ab');
            const a = new AdBlock(dir);
            const ok = await a.init((u, o) => fetch(u, o));
            console.log('собран:', ok, '| правило Shorts активно:', has(a.blocker));
            const r = a.blocker.getCosmeticsFilters({ ...ctx, url: 'https://www.youtube.com/', classes: ['ytd-rich-item-renderer'], ids: ['contents'] });
            console.log('другие правила YouTube на месте:', (r.styles || '').includes('ytd-rich-item-renderer:has(> ytd-ad-slot-renderer)'));
            const b = new AdBlock(dir); await b.init((u, o) => fetch(u, o));
            console.log('из кэша, правило Shorts активно:', has(b.blocker));
            const n = await a.blocker.match ? 'ok' : '';
            const { Request } = lib;
            const req = Request.fromRawDetails({ url: 'https://googleads.g.doubleclick.net/pagead/ads', sourceUrl: 'https://www.youtube.com/', type: 'script' });
            console.log('реклама блокируется:', a.blocker.match(req).match);
          })().catch((e) => console.log('ОШИБКА', e.stack));
          JS
          node t.js
      - name: результат в ветку
        if: always()
        run: |
          git config user.name Liquid; git config user.email viperusa08@gmail.com
          git checkout --orphan diag-out3 && git rm -rqf . && git add -f out.txt && git commit -qm out && git push -f origin diag-out3
