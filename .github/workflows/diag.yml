name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: xray
        run: |
          exec > >(tee -a out.txt) 2>&1
          node scripts/get-xray.js && node -e "const {DPI_CONFIG}=require('./vpn'); require('fs').writeFileSync('dpi.json', JSON.stringify(DPI_CONFIG(10808),null,1))"
          ./bin/xray run -test -c dpi.json
          (./bin/xray run -c dpi.json > xray.log 2>&1 &) ; sleep 2
          for u in https://www.twitch.tv/ https://www.youtube.com/; do curl -sS -o /dev/null --max-time 20 -w "%{http_code} %{time_total}s $u\n" --socks5-hostname 127.0.0.1:10808 "$u" || echo "FAIL $u"; done
      - name: ghostery и правило Shorts
        run: |
          exec > >(tee -a out.txt) 2>&1
          mkdir g && cd g && npm init -y >/dev/null && npm i @ghostery/adblocker@2 >/dev/null 2>&1 && npm ls @ghostery/adblocker | tail -1
          curl -sSL https://easylist.to/easylist/easylist.txt -o easylist.txt
          cat > t.mjs <<'JS'
          import * as G from '@ghostery/adblocker';
          import fs from 'fs';
          const list = fs.readFileSync('easylist.txt', 'utf8');
          const ctx = { url: 'https://www.youtube.com/shorts/abc', hostname: 'www.youtube.com', domain: 'youtube.com', classes: ['ytd-shorts', 'ytd-reel-video-renderer'], ids: ['shorts-inner-container'], hrefs: [], getBaseRules: true, getInjectionRules: true, getExtendedRules: true, getRulesFromHostname: true, getRulesFromDOM: true };
          const show = (name, e) => { const r = e.getCosmeticsFilters(ctx); const css = (r.styles || ''); const ext = JSON.stringify(r.extended || []);
            console.log(name, '| в стилях:', css.includes('shorts-inner-container'), '| в extended:', ext.includes('shorts-inner-container'));
            const m = css.match(/[^}]*shorts-inner-container[^{]*\{[^}]*\}/); if (m) console.log('   ', m[0].slice(0, 200)); };
          for (const ext of [false, true]) show('loadExtendedSelectors=' + ext, G.FiltersEngine.parse(list, { loadExtendedSelectors: ext, loadCosmeticFilters: true }));
          const EXC = 'youtube.com#@##shorts-inner-container > .ytd-shorts:has(> .ytd-reel-video-renderer > ytd-ad-slot-renderer)';
          show('с исключением в списке', G.FiltersEngine.parse(list + '\n' + EXC, { loadExtendedSelectors: true, loadCosmeticFilters: true }));
          const e = G.FiltersEngine.parse(list, { loadExtendedSelectors: true, loadCosmeticFilters: true });
          console.log('есть update:', typeof e.update, '| CosmeticFilter.parse:', typeof G.CosmeticFilter?.parse, '| merge:', typeof G.FiltersEngine.merge);
          try { e.update({ newCosmeticFilters: [G.CosmeticFilter.parse(EXC)] }); show('исключение через update', e); } catch (err) { console.log('update ошибка', err.message); }
          console.log('Config по умолчанию loadExtendedSelectors =', new G.Config().loadExtendedSelectors);
          JS
          node t.mjs
      - name: результат в ветку
        if: always()
        run: |
          git config user.name Liquid; git config user.email viperusa08@gmail.com
          git checkout --orphan diag-out2 && git rm -rqf . && git add -f out.txt && git commit -qm out && git push -f origin diag-out2
