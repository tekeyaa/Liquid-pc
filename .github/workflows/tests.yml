name: Автотесты

# Запускает настоящий Liquid на Windows и проверяет основное (tests/liquid.spec.js).
# Вызывается перед каждой сборкой установщика (release.yml), а ещё — на любой ветке, кроме main, и вручную.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Движок и зависимости (как у установщика)
        run: |
          npm install --no-fund --no-audit
          npm update electron --no-fund --no-audit
          npm install --no-save --no-fund --no-audit @playwright/test@1 ws@8
          node -p "'Electron ' + require('electron/package.json').version"

      - name: Тесты
        run: npx playwright test tests/liquid.spec.js
        env:
          # в рабочих ветках — с профилировщиком: где основной процесс и окно тратят время
          LIQUID_PROFILE: ${{ github.ref != 'refs/heads/main' && 'test-results/prof' || '' }}

      - name: Профиль (для сведения)
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          ls test-results/prof/*.cpuprofile >/dev/null 2>&1 || exit 0
          node tests/prof.js test-results/prof/*.cpuprofile | while IFS= read -r l; do echo "::notice title=Профиль::${l:0:1500}"; done

      - name: Заминки и списки рекламы (для сведения)
        if: always()
        shell: bash
        run: |
          [ -f test-results/stalls.txt ] && tail -40 test-results/stalls.txt | while IFS= read -r l; do echo "::notice title=Журнал::${l:0:300}"; done || true

      - name: Журнал Liquid при падении
        if: failure()
        shell: bash
        run: |
          # строки журнала браузера — пометками у запуска, чтобы причину было видно сразу
          for f in test-results/userdata-*/logs/*.log; do
            [ -f "$f" ] || continue
            grep -E "\[(WARN|ERROR|CRASH)\]" "$f" | tail -20 | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            grep -E "заминка|блокировщик" "$f" | tail -30 | while IFS= read -r l; do echo "::warning title=Заминки::${l:0:300}"; done
          done

      # замеры скорости Liquid против обычного Chromium — только в рабочих ветках (выпуск они не задерживают)
      - name: Замеры скорости
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          npx playwright install chromium >/dev/null 2>&1 || true
          : > all.json
          for mode in ab ab2; do
            unset LIQUID_PERF_AB LIQUID_PERF_NOADBLOCK LIQUID_PERF_NOHOOKS LIQUID_PERF_NOPRELOAD LIQUID_PERF_CHROMIUM LIQUID_PERF_NOSEND LIQUID_PERF_NOUI LIQUID_PERF_NOBAR LIQUID_PROFILE
            # опыты (только замеры): nosend — без подмены заголовков, ab — что в окне мешает загрузке (режимы чередуются в одном запуске)
            case $mode in liquid) export LIQUID_PROFILE=perfprof;; noadblock) export LIQUID_PERF_NOADBLOCK=1;; nohooks) export LIQUID_PERF_NOHOOKS=1;; nopreload) export LIQUID_PERF_NOHOOKS=1 LIQUID_PERF_NOPRELOAD=1;; chromium|chromium2) export LIQUID_PERF_CHROMIUM=1;; nosend) export LIQUID_PERF_NOSEND=1;; noui) export LIQUID_PERF_NOUI=1;; noui-*) export LIQUID_PERF_NOUI=${mode#noui-};; nobar) export LIQUID_PERF_NOBAR=1;; ab|ab2) export LIQUID_PERF_AB=1;; esac
            npx playwright test tests/perf.spec.js >/dev/null 2>&1 || true
            cat test-results/perf.json >> all.json 2>/dev/null || true
          done
          cat all.json | while IFS= read -r l; do echo "::notice title=Скорость Liquid::$l"; done
          # где окно (perfui) и основной процесс (perfmain) тратят время, пока грузятся страницы замера
          # (папка профиля — вне test-results: Playwright чистит её перед каждым запуском)
          ls perfprof/*.cpuprofile >/dev/null 2>&1 && node tests/prof.js perfprof/*.cpuprofile | while IFS= read -r l; do echo "::notice title=Профиль загрузок::${l:0:1500}"; done || true

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # кнопка «Обучить» Liquid RTX: свой Python + PyTorch ставятся с нуля и учат на пробных данных (без видеокарты — на процессоре)
  rtx-train:
    if: github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Обучение Liquid RTX из браузера
        run: node tests/rtx-train.js

  # шейдеры Liquid RTX 2 (раздел 7 webview-preload.js) == эталон на numpy: Chromium без видеокарты (SwiftShader),
  # случайная сеть на один и на два кадра, кадр нечётного размера; плюс память движка не растёт при смене сетей
  rtx-gl:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: numpy и Chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pip install numpy
          npm install --no-save --no-fund --no-audit playwright@1
          npx playwright install --with-deps chromium
      - name: Шейдеры RTX 2 == эталон
        run: node tests/rtx2-gl.js
