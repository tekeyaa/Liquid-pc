name: Автотесты

# Запускает настоящий Liquid на Windows и проверяет основное (tests/liquid.spec.js).
# Вызывается перед каждой сборкой установщика (release.yml), а ещё — на любой ветке, кроме main, и вручную.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Движок и зависимости (как у установщика)
        run: |
          npm install --no-fund --no-audit
          npm update electron --no-fund --no-audit
          npm install --no-save --no-fund --no-audit @playwright/test@1 ws@8
          node -p "'Electron ' + require('electron/package.json').version"

      - name: Тесты
        run: npx playwright test tests/liquid.spec.js

      - name: Заминки и списки рекламы (для сведения)
        if: always()
        shell: bash
        run: |
          [ -f test-results/stalls.txt ] && tail -40 test-results/stalls.txt | while IFS= read -r l; do echo "::notice title=Журнал::${l:0:300}"; done || true

      - name: Журнал Liquid при падении
        if: failure()
        shell: bash
        run: |
          # строки журнала браузера — пометками у запуска, чтобы причину было видно сразу
          for f in test-results/userdata-*/logs/*.log; do
            [ -f "$f" ] || continue
            grep -E "\[(WARN|ERROR|CRASH)\]" "$f" | tail -20 | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
            grep -E "заминка|блокировщик" "$f" | tail -30 | while IFS= read -r l; do echo "::warning title=Заминки::${l:0:300}"; done
          done

      # замеры скорости Liquid против обычного Chromium — только в рабочих ветках (выпуск они не задерживают)
      - name: Замеры скорости
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          npx playwright install chromium >/dev/null 2>&1 || true
          : > all.json
          for mode in liquid noadblock chromium liquid2; do
            case $mode in noadblock) export LIQUID_PERF_NOADBLOCK=1;; chromium) unset LIQUID_PERF_NOADBLOCK; export LIQUID_PERF_CHROMIUM=1;; liquid2) unset LIQUID_PERF_CHROMIUM;; esac
            npx playwright test tests/perf.spec.js >/dev/null 2>&1 || true
            cat test-results/perf.json >> all.json 2>/dev/null || true
          done
          cat all.json | while IFS= read -r l; do echo "::notice title=Скорость Liquid::$l"; done

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
