name: Сборка установщика

# При каждом изменении в main собирает Liquid-Setup.exe и выкладывает его в релиз своей версии
# (номер берётся из package.json, описание — из CHANGELOG.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Версия
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Код браузера внутрь установщика
        run: |
          zip -qr installer/payload.zip . -x ".git/*" ".github/*" "installer/*" "node_modules/*" "dist/*" "Liquid/*" "bin/xray*"
          ls -la installer/payload.zip

      - name: Установщик
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s/add(\"DisplayVersion\", \"REG_SZ\", \"[^\"]*\")/add(\"DisplayVersion\", \"REG_SZ\", \"$V\")/" installer/installer.go
          cd installer && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../Liquid-Setup.exe .
          ls -la ../Liquid-Setup.exe
          cd .. && sha256sum Liquid-Setup.exe > Liquid-Setup.exe.sha256 && cat Liquid-Setup.exe.sha256

      - name: Описание релиза из CHANGELOG
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re
          v = os.environ['V']
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(v) + r'\b.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
          body = (m.group(1).strip() if m else 'Сборка ' + v)
          open('notes.md', 'w', encoding='utf-8').write(body + '\n\nСкачай **Liquid-Setup.exe** и запусти — он поставит или обновит браузер.\n')
          EOF

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" Liquid-Setup.exe Liquid-Setup.exe.sha256 --clobber
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" Liquid-Setup.exe Liquid-Setup.exe.sha256 --title "Liquid $V" --notes-file notes.md --latest
          fi
