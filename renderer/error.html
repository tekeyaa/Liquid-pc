<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Не открылось</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080f; color: rgba(255,255,255,.92); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif; overflow: hidden; }
  .bg { position: fixed; inset: 0; } .bg i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .4; }
  .bg .a { width: 50vw; height: 50vw; left: 25vw; top: -20vw; background: #d97757; } .bg .b { width: 40vw; height: 40vw; left: 5vw; bottom: -20vw; background: #5b3df5; }
  main { position: relative; height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { width: min(480px, 92vw); padding: 32px; border-radius: 28px; text-align: center; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05)); backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 30px 60px -24px rgba(0,0,0,.7); animation: rise .7s cubic-bezier(.2,.9,.25,1.12); }
  .emoji { font-size: 44px; } h1 { font-size: 21px; margin: 10px 0 6px; font-weight: 650; }
  p { color: rgba(255,255,255,.6); margin: 0 0 6px; word-break: break-all; } code { font-size: 12px; opacity: .6; }
  .hint { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.25); color: #b7f5cd; }
  button { margin-top: 20px; height: 42px; padding: 0 22px; border-radius: 14px; border: 0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; background: linear-gradient(180deg, #e88a68, #c9633f); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 22px -10px rgba(217,119,87,.9); transition: transform .4s cubic-bezier(.2,.9,.25,1.12); }
  button:active { transform: scale(.93); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } }
</style>
</head>
<body>
  <div class="bg"><i class="a"></i><i class="b"></i></div>
  <main>
    <div class="card">
      <div class="emoji">🫧</div>
      <h1>Сайт не открылся</h1>
      <p id="url"></p>
      <code id="code"></code>
      <div class="hint" id="hint" hidden>Похоже на блокировку. Включи VPN — кнопка «VPN» сверху справа.</div>
      <button id="retry">Попробовать ещё раз</button>
    </div>
  </main>
<script>
  let info = {};
  try { info = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch {}
  document.getElementById('url').textContent = info.url || '';
  document.getElementById('code').textContent = info.desc ? `${info.desc} (${info.code})` : '';
  const blocky = ['ERR_CONNECTION_RESET', 'ERR_CONNECTION_CLOSED', 'ERR_CONNECTION_TIMED_OUT', 'ERR_TIMED_OUT', 'ERR_SSL_PROTOCOL_ERROR', 'ERR_CONNECTION_REFUSED', 'ERR_EMPTY_RESPONSE', 'ERR_QUIC_PROTOCOL_ERROR', 'ERR_NAME_NOT_RESOLVED'];
  if (info.hint === 'vpn' && blocky.includes(info.desc)) document.getElementById('hint').hidden = false;
  document.getElementById('retry').onclick = () => { if (info.url) location.replace(info.url); };
</script>
</body>
</html>
